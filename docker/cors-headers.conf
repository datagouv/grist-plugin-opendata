# CORS for Grist, which loads this app from its own origin.
# Kept in its own file because an add_header in a location block discards
# every header inherited from the server block, so any block that sets its
# own Cache-Control has to include this as well.
add_header Access-Control-Allow-Origin  "*" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
add_header Access-Control-Allow-Headers "X-Requested-With, content-type, Authorization" always;
