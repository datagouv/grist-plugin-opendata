server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/cors-headers.conf;

    # Answer preflights instead of letting them fall through to a 405.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Hashed filenames, safe to cache indefinitely. add_header is required for
    # `immutable` (the expires directive can only emit max-age) and it drops
    # the inherited CORS headers, hence the include.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        include /etc/nginx/cors-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html names the current bundle, so caching it pins clients to a
    # stale build.
    location = /index.html {
        include /etc/nginx/cors-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Real files first, so /oauth-callback.html is served as itself rather
    # than rewritten to index.html. The fallback is what makes the history
    # routes (/publish-catalogue, /validata, ...) resolve on a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
